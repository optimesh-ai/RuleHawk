logical-systems {
    LS-A {
        firewall {
            family inet {
                filter EDGE {
                    term block-corp {
                        from {
                            source-address 192.0.2.0/24;
                            destination-address 198.51.100.0/24;
                        }
                        then discard;
                    }
                }
            }
        }
    }
    LS-B {
        firewall {
            family inet {
                filter EDGE {
                    term allow-all {
                        then accept;
                    }
                }
            }
        }
    }
}
