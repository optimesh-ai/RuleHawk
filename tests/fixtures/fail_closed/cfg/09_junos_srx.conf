security {
    policies {
        from-zone corp to-zone pci {
            policy allow-smb {
                match {
                    source-address any;
                    destination-address any;
                    application junos-smb;
                }
                then {
                    permit;
                }
            }
        }
        default-policy {
            permit-all;
        }
    }
}
firewall {
    family inet {
        filter PROTECT-RE {
            term block-corp {
                from {
                    source-address 192.0.2.0/24;
                }
                then discard;
            }
            term rest {
                then accept;
            }
        }
    }
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
            }
        }
    }
}
