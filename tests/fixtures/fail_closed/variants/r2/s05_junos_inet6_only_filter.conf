interfaces {
    ge-0/0/0 { unit 0 { family inet { address 192.0.2.1/24; } family inet6 { filter { input F6; } address 2001:db8:1::1/64; } } }
    ge-0/0/1 { unit 0 { family inet { address 198.51.100.1/24; } family inet6 { filter { input F6; } address 2001:db8:2::1/64; } } }
}
firewall {
    family inet6 {
        filter F6 {
            term d { from { source-address { 2001:db8:1::/64; } destination-address { 2001:db8:2::/64; } } then discard; }
        }
    }
    family inet {
        filter F {
            term d { from { source-address { 192.0.2.0/24; } destination-address { 198.51.100.0/24; } } then discard; }
        }
    }
}
