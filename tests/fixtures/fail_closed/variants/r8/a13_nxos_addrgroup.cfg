version 9.3(10)
feature interface-vlan
interface Ethernet1/1
  no switchport
  ip address 192.0.2.1/24
  ip access-group F in
interface Ethernet1/2
  no switchport
  ip address 198.51.100.1/24
  ip access-group F in
object-group ip address CORPG
  10 192.0.2.0/24
ip access-list F
  10 deny ip addrgroup CORPG 198.51.100.0/24
  20 permit ip 203.0.113.0/24 any
