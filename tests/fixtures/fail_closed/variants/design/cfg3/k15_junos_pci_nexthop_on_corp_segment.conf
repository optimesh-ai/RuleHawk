interfaces {
    ge-0/0/0 { unit 0 { family inet { filter { input F; } address 192.0.2.1/24; } } }
}
routing-options {
    static { route 198.51.100.0/24 next-hop 192.0.2.254; }
}
firewall {
    family inet {
        filter F {
            term d {
                from { source-address { 192.0.2.0/24; } destination-address { 198.51.100.0/24; } }
                then discard;
            }
            term a { from { source-address { 203.0.113.0/24; } } then accept; }
        }
    }
}
