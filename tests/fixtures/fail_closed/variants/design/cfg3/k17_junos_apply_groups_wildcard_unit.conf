groups {
    G { interfaces { <ge-0/0/2> { unit 0 { family inet { address 192.0.2.2/25; } } } } }
}
apply-groups G;
interfaces {
    ge-0/0/0 { unit 0 { family inet { filter { input F; } address 192.0.2.1/25; } } }
    ge-0/0/1 { unit 0 { family inet { filter { input F; } address 198.51.100.1/24; } } }
    ge-0/0/2 { unit 0 { description "address from group G"; } }
}
firewall {
    family inet {
        filter F {
            term d {
                from { source-address { 192.0.2.0/24; } destination-address { 198.51.100.0/24; } }
                then discard;
            }
            term a { from { source-address { 203.0.113.0/24; } } then accept; }
        }
    }
}
