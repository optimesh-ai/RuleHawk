interfaces {
    irb { unit 10 { family inet { filter { input F; } address 192.0.2.1/24; address 198.51.100.1/24; } } }
}
firewall {
    family inet {
        filter F {
            term d {
                from { source-address { 192.0.2.0/24; } destination-address { 198.51.100.0/24; } }
                then discard;
            }
            term a { then accept; }
        }
    }
}
