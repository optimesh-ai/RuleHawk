interfaces {
    ge-0/0/0 { unit 0 { family inet { filter { input F; } address 192.0.2.1/24; } } }
    ge-0/0/1 { unit 0 { family inet { filter { input F; } address 198.51.100.1/24; } } }
}
services {
    nat {
        pool P { address 198.51.100.5/32; }
        rule R { match-direction input; term t { from { destination-address { 203.0.113.5/32; } } then { translated { destination-pool P; translation-type { dnat-44; } } } } }
    }
}
firewall { family inet { filter F {
    term d { from { source-address { 192.0.2.0/24; } destination-address { 198.51.100.0/24; } } then discard; }
    term a { from { source-address { 192.0.2.0/24; } destination-address { 203.0.113.5/32; } } then accept; } } } }
