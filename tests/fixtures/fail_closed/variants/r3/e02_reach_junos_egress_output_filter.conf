interfaces {
    ge-0/0/0 { unit 0 { family inet { filter { input A; output A; } address 192.0.2.1/24; } } }
    ge-0/0/1 { unit 0 { family inet { filter { input A; output B; } address 198.51.100.1/24; } } }
}
firewall { family inet {
    filter A { term a { from { source-address { 192.0.2.0/24; 198.51.100.0/24; } } then accept; } }
    filter B { term d { from { source-address { 192.0.2.0/24; } } then discard; } term a { then accept; } } } }
