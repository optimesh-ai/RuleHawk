policy-options {
    prefix-list PL { 192.0.2.0/24; }
}
interfaces {
    ge-0/0/0 { unit 0 { family inet { filter { input F; } address 192.0.2.1/24; } } }
    ge-0/0/1 { unit 0 { family inet { filter { input F; } address 198.51.100.1/24; } } }
}
firewall {
    family inet {
        filter F {
            term d { from { source-prefix-list { PL; } destination-address { 198.51.100.0/24; } } then discard; }
            term a { from { source-address { 192.0.2.0/24; } } then accept; }
        }
    }
}
