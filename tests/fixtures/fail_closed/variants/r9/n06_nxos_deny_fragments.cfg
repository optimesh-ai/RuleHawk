version 9.3(10)
feature interface-vlan
interface Ethernet1/1
  no switchport
  ip address 192.0.2.1/24
  ip access-group F in
interface Ethernet1/2
  no switchport
  ip address 198.51.100.1/24
  ip access-group F in
ip access-list F
  10 deny ip 192.0.2.0/24 198.51.100.0/24 fragments
  20 permit ip 192.0.2.0/24 any
