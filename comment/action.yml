name: 'RuleHawk combined PR comment'
description: >-
  Combine every RuleHawk check in a workflow run into one sticky PR comment,
  headed by the worst verdict. Run it in a job that needs your gate jobs.
author: 'OptiMesh'
branding:
  icon: 'shield'
  color: 'blue'

# Usage: each gate step sets `share-results: true` and `comment: false`; then
#
#   verdict:
#     needs: [segmentation, egress]
#     if: ${{ !cancelled() }}
#     runs-on: ubuntu-latest
#     steps:
#       - uses: optimesh-ai/RuleHawk/comment@v1
#         with:
#           expect: 3          # one per gate step that shares its result
#           jobs: ${{ toJSON(needs) }}
#
# FAIL if any check failed; UNKNOWN if fewer than `expect` checks reported (a
# job crashed, was cancelled or skipped), a result could not be read, or a gate
# job did not succeed although its results show no failure. Fail-closed
# stopgap (0.4.1): never PASS; a check that does not fail is UNKNOWN, and a
# `passed: true` record from an older gate is UNKNOWN too.

inputs:
  expect:
    description: >-
      How many checks must report: one per gate step with share-results: true.
      Fewer results make the verdict UNKNOWN, never PASS.
    required: true
  jobs:
    description: >-
      The combining job's needs context, as JSON: pass the expression
      toJSON(needs). A gate
      job that did not succeed, but whose results show no failure (say, a
      re-run whose result never uploaded, leaving the first attempt's PASS),
      makes the verdict UNKNOWN.
    required: true
  results:
    description: >-
      Result files or directories to combine, whitespace separated. Empty (the
      default) downloads this run's rulehawk-results-* artifacts.
    required: false
    default: ''
  comment:
    description: 'Post/update the sticky PR comment on pull_request events (true|false)'
    required: false
    default: 'true'
  fail:
    description: >-
      Fail this step on any enforced FAIL or UNKNOWN (true|false). In 0.4.1
      every enforced check that does not fail is UNKNOWN (fail-closed
      stopgap), so this step fails unless every check is fail-on none.
    required: false
    default: 'true'

outputs:
  verdict:
    description: >-
      FAIL | UNKNOWN: the worst verdict across every check, suffixed
      " (not enforced)" when only fail-on none checks have it. Never PASS in
      0.4.1 (fail-closed stopgap): a check that does not fail is UNKNOWN.
    value: ${{ steps.combine.outputs.verdict }}
  comment-file:
    description: 'Path to the combined comment body (markdown)'
    value: ${{ steps.combine.outputs.comment }}

runs:
  using: 'composite'
  steps:
    # A download that fails must not leave an earlier invocation's records
    # standing in for this one's.
    - name: Start from an empty results directory
      if: inputs.results == ''
      shell: bash
      run: rm -rf "${RUNNER_TEMP:-/tmp}/rulehawk-combine-in"

    # Every attempt's artifacts: after "re-run failed jobs" the jobs that passed
    # keep their first-attempt results, and `rulehawk combine` keeps only the
    # newest attempt of each check.
    - name: Download this run's RuleHawk results
      if: inputs.results == ''
      continue-on-error: true      # none found -> combine reports UNKNOWN
      uses: actions/download-artifact@v4
      with:
        pattern: rulehawk-results-*
        path: ${{ runner.temp }}/rulehawk-combine-in
        merge-multiple: true

    - name: Combine every check
      id: combine
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/..
        RH_EXPECT: ${{ inputs.expect }}
        RH_NEEDS: ${{ inputs.jobs }}
        RH_RESULTS: ${{ inputs.results }}
      run: |
        set -u
        IN="${RH_RESULTS:-${RUNNER_TEMP:-/tmp}/rulehawk-combine-in}"
        # A path of its own: a later invocation in the job must not overwrite
        # this one's comment-file output.
        BODY="$(mktemp "${RUNNER_TEMP:-/tmp}/rulehawk-combined-comment-XXXXXX")" \
          || BODY="${RUNNER_TEMP:-/tmp}/rulehawk-combined-comment-$$-${RANDOM}"
        rm -f "${BODY}"
        # noglob: the inputs are paths, split on whitespace only.
        set +e -f
        VFILE="${BODY}.verdict"
        python3 -m rulehawk combine ${IN} --expect "${RH_EXPECT}" --needs "${RH_NEEDS}" \
          --comment "${BODY}" --verdict "${VFILE}"
        RC=$?
        set +f
        # ENFORCED is the verdict over the enforced checks: "PASS" here only
        # means no enforced check blocks (every check is fail-on none).
        case "${RC}" in
          0) ENFORCED=PASS ;;
          1) ENFORCED=FAIL ;;
          *) ENFORCED=UNKNOWN ;;
        esac
        VERDICT="${ENFORCED}"
        # Exit 0: only fail-on none checks; report the headline as shown.
        if [ "${RC}" = "0" ]; then
          VERDICT="$(head -n 1 "${VFILE}" 2>/dev/null)"
          # Fail-closed stopgap: 0.4.1 never reports PASS. A missing or empty
          # verdict file, or one that says PASS, is not trusted.
          case "${VERDICT}" in
            ""|PASS*) VERDICT=UNKNOWN; ENFORCED=UNKNOWN ;;
          esac
        fi
        # Belt and braces: a body that reads PASS is replaced, never posted
        # (the verdict is never PASS in 0.4.1).
        if [ -s "${BODY}" ] && grep -q '^## ✅' "${BODY}"; then
          rm -f "${BODY}"
        fi
        if [ ! -s "${BODY}" ]; then
          VERDICT=UNKNOWN
          ENFORCED=UNKNOWN
          printf '%s\n## ❌ RuleHawk firewall gate: UNKNOWN\n\nThe checks could not be combined into a comment; see the job log.\n' \
            '<!-- rulehawk-gate -->' > "${BODY}"
        fi
        { echo "verdict=${VERDICT}"; echo "enforced=${ENFORCED}"; echo "comment=${BODY}"; } >> "${GITHUB_OUTPUT}"

    - name: Sticky PR comment
      if: always() && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.combine.outputs.comment != ''
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        RH_COMMENT_PATH: ${{ steps.combine.outputs.comment }}
        RH_STICKY_JS: ${{ github.action_path }}/sticky.js
      with:
        script: |
          const sticky = require(process.env.RH_STICKY_JS);
          await sticky({github, context, core, bodyPath: process.env.RH_COMMENT_PATH,
                        issueNumber: context.payload.pull_request.number});

    - name: Enforce the combined verdict
      if: always() && inputs.fail == 'true'
      shell: bash
      env:
        RH_VERDICT: ${{ steps.combine.outputs.verdict }}
        RH_ENFORCED: ${{ steps.combine.outputs.enforced }}
      run: |
        if [ "${RH_ENFORCED:-UNKNOWN}" != "PASS" ]; then
          echo "::error title=RuleHawk combined verdict: ${RH_VERDICT:-UNKNOWN}::Not every RuleHawk check in this run passed — see the PR comment and each job's summary. An UNKNOWN check is the 0.4.1 fail-closed stopgap (fail-closed stopgap pending soundness review)."
          exit 1
        fi
        case "${RH_VERDICT:-}" in
          ""|PASS*)
            # 0.4.1 never reports PASS (fail-closed stopgap): fail closed.
            echo "::error title=RuleHawk combined verdict (fail-closed-stopgap)::Unexpected combined verdict '${RH_VERDICT:-}': this release never reports PASS (fail-closed stopgap pending soundness review); failing closed."
            exit 1 ;;
        esac
        echo "::warning title=RuleHawk combined verdict: ${RH_VERDICT}::Only fail-on none checks have this verdict; they are reported, not enforced."
