name: 'RuleHawk firewall gate'
description: >-
  Multi-vendor firewall config auditor: finds dead rules and dangerous exposure, proves it with witness packets.
author: 'OptiMesh'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  configs:
    description: >-
      Files or globs to audit, whitespace/newline separated (recursive ** is
      supported). Example: "firewall/**/*.conf network/acls/*.acl".
    required: true
  policy:
    description: >-
      Path to a segmentation policy JSON (zones + must_not_reach). Omit to run
      hygiene checks only.
    required: false
    default: ''
  fail-on:
    description: 'Fail the check at this severity or worse: critical | high | medium | low | none'
    required: false
    default: 'high'
  vendor:
    description: 'Force a vendor for every file: auto | ios | junos | panos | iptables | nxos | eos | aws-sg'
    required: false
    default: 'auto'
  comment:
    description: >-
      Post/update a single sticky PR comment with the findings (true|false).
      Several gate steps in one job share the one comment, headed by the worst
      verdict. Across jobs, set this to false and combine with
      optimesh-ai/RuleHawk/comment (see share-results).
    required: false
    default: 'true'
  label:
    description: >-
      A short name for this check in the PR comment, e.g. "PCI segmentation".
      Defaults to the configs and policy it checked.
    required: false
    default: ''
  share-results:
    description: >-
      Upload this check's result as a workflow artifact, so a job that runs
      optimesh-ai/RuleHawk/comment can combine every check of the run into one
      PR comment headed by the worst verdict (true|false).
    required: false
    default: 'false'
  evidence:
    description: >-
      Emit a compliance-evidence artifact (JSON + markdown) for every run:
      provenance (SHA-256 of each config audited, tool version, timestamp),
      VERIFIED/FAILED policy attestations, and PCI/NIST/ISO/CIS/SOC 2/HIPAA
      control references. Paths are exposed as the `evidence-file` and
      `evidence-md-file` outputs; upload them with actions/upload-artifact to
      keep a dated audit trail of every change. (true|false)
    required: false
    default: 'false'
  upload-sarif:
    description: >-
      Upload SARIF to GitHub code scanning so each finding is annotated on the
      exact line in the PR diff (true|false). Needs code scanning enabled and
      `security-events: write`.
    required: false
    default: 'true'
  working-directory:
    description: 'Directory to run the audit in'
    required: false
    default: '.'
  python-version:
    description: >-
      Optional Python to set up (RuleHawk needs >=3.9). Leave empty to use the
      python3 already on the runner — that is the fast path (no setup step).
    required: false
    default: ''

outputs:
  passed:
    description: 'true when no finding met the fail-on threshold'
    value: ${{ steps.gate.outputs.passed }}
  score:
    description: 'Lowest hygiene score (0-100) across the audited files'
    value: ${{ steps.gate.outputs.score }}
  worst-severity:
    description: 'Highest severity found: critical | high | medium | low | none'
    value: ${{ steps.gate.outputs.worst }}
  evidence-file:
    description: >-
      Path to the compliance-evidence JSON artifact (empty unless evidence: true)
    value: ${{ steps.gate.outputs.evidence }}
  evidence-md-file:
    description: >-
      Path to the evidence artifact rendered as markdown (empty unless
      evidence: true)
    value: ${{ steps.gate.outputs.evidence_md }}
  sarif-file:
    description: 'Path to the generated SARIF report'
    value: ${{ steps.gate.outputs.sarif }}
  result-file:
    description: >-
      Path to this check's result record (what `rulehawk combine` and
      optimesh-ai/RuleHawk/comment read)
    value: ${{ steps.reserve.outputs.result }}

runs:
  using: 'composite'
  steps:
    # Reserve this check's result FIRST, before Python setup and outside the
    # caller's working-directory, so a gate step that cannot even start still
    # leaves a record: the combined comment shows it as UNKNOWN instead of
    # leaving an earlier check's PASS standing. One record per gate step, kept
    # for the whole job (RUNNER_TEMP is emptied at the start of every job,
    # never between steps).
    - name: Reserve this check's result
      id: reserve
      shell: bash
      run: |
        set -euo pipefail
        RESULT_DIR="${RUNNER_TEMP:-/tmp}/rulehawk-results"
        mkdir -p "${RESULT_DIR}"
        RESULT_N=$(( $(find "${RESULT_DIR}" -name '*.json' | wc -l) + 1 ))
        RESULT_ID="$(printf '%s-%04d-%s%s' "${GITHUB_JOB:-job}" "${RESULT_N}" "${RANDOM}" "${RANDOM}")"
        RESULT="${RESULT_DIR}/${RESULT_ID}.json"
        printf '{"schema": "rulehawk.result/v1", "pending": true}\n' > "${RESULT}"
        { echo "result=${RESULT}"; echo "result_id=${RESULT_ID}"; echo "result_dir=${RESULT_DIR}"; } >> "${GITHUB_OUTPUT}"

    # Optional Python setup — skipped by default (GitHub runners already ship
    # Python 3.9+, so the common path adds zero install time).
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    # The whole gate. RuleHawk is pure-Python with no dependencies, so we run it
    # straight from the action's checkout via PYTHONPATH — no `pip install`, no
    # Docker image pull. It typically finishes in well under a second.
    - name: Run RuleHawk gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RH_CONFIGS: ${{ inputs.configs }}
        RH_POLICY: ${{ inputs.policy }}
        RH_FAIL_ON: ${{ inputs.fail-on }}
        RH_VENDOR: ${{ inputs.vendor }}
        RH_EVIDENCE: ${{ inputs.evidence }}
        RH_LABEL: ${{ inputs.label }}
        RH_RESULT: ${{ steps.reserve.outputs.result }}
        # Import the engine from the action's own checkout (zero install).
        PYTHONPATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        SARIF="${RUNNER_TEMP:-/tmp}/rulehawk.sarif"
        JSON="${RUNNER_TEMP:-/tmp}/rulehawk.json"
        COMMENT="${RUNNER_TEMP:-/tmp}/rulehawk-comment.md"
        EVIDENCE="${RUNNER_TEMP:-/tmp}/rulehawk-evidence.json"
        EVIDENCE_MD="${RUNNER_TEMP:-/tmp}/rulehawk-evidence.md"
        EVIDENCE_ARGS=()
        if [ "${RH_EVIDENCE}" = "true" ]; then
          EVIDENCE_ARGS=(--evidence "${EVIDENCE}" --evidence-md "${EVIDENCE_MD}")
        fi
        POLICY_ARGS=()
        if [ -n "${RH_POLICY}" ]; then POLICY_ARGS=(--policy "${RH_POLICY}"); fi
        LABEL_ARGS=()
        if [ -n "${RH_LABEL}" ]; then LABEL_ARGS=(--label "${RH_LABEL}"); fi

        # This check's record (reserved above as a placeholder); RuleHawk
        # replaces it with the verdict. The comment step combines every record
        # in the job, so a later passing check cannot hide an earlier failure.
        RESULT="${RH_RESULT}"

        # Start clean: every path advertised below is advertised only if THIS
        # run wrote it, so a file left behind by an earlier gate step in the
        # same job (RUNNER_TEMP is shared) can never pass as this step's
        # artifact or verdict.
        rm -f "${SARIF}" "${JSON}" "${COMMENT}" "${EVIDENCE}" "${EVIDENCE_MD}" \
              "${RUNNER_TEMP:-/tmp}/rulehawk.rc"

        # `set -f` (noglob) hands ** / * patterns to RuleHawk verbatim so its own
        # recursive globber expands them — whitespace still splits multiple
        # patterns into separate arguments.
        # errexit OFF for the rest of this step: the gate's own exit code is the
        # verdict (captured below), and reporting is best-effort — nothing here may
        # abort the step, or a failed gate could be masked as green.
        set +e -f
        # ${arr[@]+...} guards EVERY empty-array expansion: bash 3.2 (macOS
        # runners, still the default `bash` there) treats "${ARR[@]}" on an
        # empty array as an unbound variable under `set -u` and aborts the step
        # before the verdict file is even written. Bash 4.4 fixed it, so Linux
        # runners never see this — which is exactly why it must be guarded here
        # rather than trusted to CI. tests/test_action.py pins the form AND
        # executes the command line under the system bash.
        python3 -m rulehawk gate ${RH_CONFIGS} \
          ${POLICY_ARGS[@]+"${POLICY_ARGS[@]}"} \
          --fail-on "${RH_FAIL_ON}" \
          --vendor "${RH_VENDOR}" \
          --sarif "${SARIF}" \
          --json "${JSON}" \
          --comment "${COMMENT}" \
          --result "${RESULT}" \
          ${LABEL_ARGS[@]+"${LABEL_ARGS[@]}"} \
          ${EVIDENCE_ARGS[@]+"${EVIDENCE_ARGS[@]}"}
        RC=$?
        set +f

        # Persist the verdict FIRST so nothing below can mask it (the final
        # 'Enforce' step re-raises it after SARIF + comment have posted).
        echo "${RC}" > "${RUNNER_TEMP:-/tmp}/rulehawk.rc"

        # Surface paths + parsed outputs for later steps (best-effort; never abort).
        # Only advertise an artifact path when the file truly exists, so the SARIF
        # upload / comment steps never try to read a file a failed gate didn't write.
        {
          [ -f "${SARIF}" ]   && echo "sarif=${SARIF}"     || echo "sarif="
          [ -f "${JSON}" ]    && echo "json=${JSON}"       || echo "json="
          [ -f "${COMMENT}" ] && echo "comment=${COMMENT}" || echo "comment="
          [ -f "${EVIDENCE}" ] && echo "evidence=${EVIDENCE}" || echo "evidence="
          [ -f "${EVIDENCE_MD}" ] && echo "evidence_md=${EVIDENCE_MD}" \
                                  || echo "evidence_md="
          echo "exit_code=${RC}"
        } >> "${GITHUB_OUTPUT}"
        python3 - "${JSON}" >> "${GITHUB_OUTPUT}" <<'PY' || true
        import json, sys
        d = json.load(open(sys.argv[1]))
        print("passed=" + ("true" if d["passed"] else "false"))
        print("score=" + ("" if d["score"] is None else str(d["score"])))
        print("worst=" + str(d["worst_severity"]))
        PY
        exit 0

    # Annotate the exact changed lines in the PR diff (and feed the Security tab).
    # `always()` so a failing gate still uploads; harmless no-op if disabled.
    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.gate.outputs.sarif != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.gate.outputs.sarif }}
        category: rulehawk

    # Hand this check's result to a later job that combines every check of the
    # run into one comment (optimesh-ai/RuleHawk/comment). A failed upload
    # fails the job: the combining job then sees a failed job whose results
    # show no failure and says UNKNOWN, rather than trusting a result from an
    # earlier attempt.
    - name: Share the result with a combining job
      if: always() && inputs.share-results == 'true' && steps.reserve.outputs.result != ''
      uses: actions/upload-artifact@v4
      with:
        name: rulehawk-results-${{ github.run_attempt }}-${{ steps.reserve.outputs.result_id }}
        path: ${{ steps.reserve.outputs.result }}
        retention-days: 7
        if-no-files-found: error

    # The comment body: every check this job has run so far, headed by the
    # worst verdict. With one check it is exactly that check's report.
    - name: Combine this job's checks
      id: combine
      if: always() && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.reserve.outputs.result_dir != ''
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        RH_RESULT_DIR: ${{ steps.reserve.outputs.result_dir }}
      run: |
        BODY="${RUNNER_TEMP:-/tmp}/rulehawk-combined-comment.md"
        rm -f "${BODY}"
        python3 -m rulehawk combine "${RH_RESULT_DIR}" --comment "${BODY}" \
          --summary /dev/null -q || true
        # No body means the combine itself broke: say so rather than leave the
        # previous verdict standing.
        if [ ! -s "${BODY}" ]; then
          printf '%s\n## ❌ RuleHawk firewall gate: UNKNOWN\n\nThis job'"'"'s checks could not be combined into a comment; see the job log.\n' \
            '<!-- rulehawk-gate -->' > "${BODY}"
        fi
        echo "comment=${BODY}" >> "${GITHUB_OUTPUT}"

    # Post / update ONE sticky comment so reviewers see the verdict + witnesses in
    # the conversation. continue-on-error keeps fork PRs (read-only token) green
    # on the comment step — the check + SARIF still gate the merge.
    - name: Sticky PR comment
      if: always() && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.combine.outputs.comment != ''
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        # Passed via env, not ${{ }}-interpolated into JS source — the value is
        # runner-generated today, but inlining is the canonical script-injection
        # shape and one refactor away from being exploitable.
        RH_COMMENT_PATH: ${{ steps.combine.outputs.comment }}
        RH_STICKY_JS: ${{ github.action_path }}/comment/sticky.js
      with:
        script: |
          const sticky = require(process.env.RH_STICKY_JS);
          await sticky({github, context, core, bodyPath: process.env.RH_COMMENT_PATH,
                        issueNumber: context.payload.pull_request.number});

    # Re-raise the gate verdict so the check goes red exactly when it should.
    # Fails CLOSED when the verdict file is missing: that means the gate step
    # aborted before it could run RuleHawk, and a missing verdict must never
    # read as "passed".
    - name: Enforce gate verdict
      if: always()
      shell: bash
      env:
        # Bound as env, never ${{ }}-inlined into the script body (the same
        # script-injection hygiene as the comment step).
        RH_FAIL_ON: ${{ inputs.fail-on }}
        RH_WORST: ${{ steps.gate.outputs.worst }}
      run: |
        RC="$(cat "${RUNNER_TEMP:-/tmp}/rulehawk.rc" 2>/dev/null || echo missing)"
        if [ "${RC}" = "missing" ]; then
          echo "::error title=RuleHawk gate did not complete::No verdict was recorded — the gate step aborted before RuleHawk ran. See the step log above."
          exit 1
        elif [ "${RC}" = "2" ]; then
          echo "::error title=RuleHawk gate failed (fail-closed)::RuleHawk exited 2: a config parsed to zero rules, a 'configs' pattern matched no files, or an input was invalid — it will not certify isolation it could not verify. See the step log; check the vendor/format or set the 'vendor' input."
          exit 1
        elif [ "${RC}" != "0" ]; then
          echo "::error title=RuleHawk gate failed::Findings at or above '${RH_FAIL_ON}' block this change — see the job summary and PR comment."
          exit 1
        fi
        echo "RuleHawk gate passed (worst severity: ${RH_WORST})."
