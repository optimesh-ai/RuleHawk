name: RuleHawk CI

# The engine's own gate: run the analysis-engine test suite on every change, and
# dogfood the composite Action end-to-end on real samples so the gate wiring
# itself — outputs, verdict plumbing, the evidence artifact, bash-3.2 safety —
# is exercised in real CI on both Linux and macOS runners.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per ref: a superseded PR push cancels the stale run; pushes to
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Engine test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # PyYAML is a TEST dependency only (the engine has none): it is what lets
      # tests/test_action.py load action.yml. Without it that module
      # importorskips and the Action wiring — outputs, accepted flags, the
      # bash-3.2 empty-array guards — is never checked in CI.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml
      - name: Verify the Action wiring tests will run (PyYAML importable)
        run: python -c "import yaml; print('PyYAML', yaml.__version__)"
      # The MCP server is the optional `mcp` extra (MCP SDK, Python 3.10+). On
      # 3.9 the marker installs the engine alone and tests/test_mcp_stdio.py
      # importorskips; on 3.12 the stdio integration test must actually run.
      - name: Install the package with the MCP extra
        run: python -m pip install --quiet -e ".[mcp]"
      - name: Verify the MCP stdio tests will run (MCP SDK importable, 3.12)
        if: matrix.python-version == '3.12'
        run: |
          python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
          rulehawk-mcp --version
      - name: Run tests
        run: python -m pytest -q -rs
      # The same check the suite runs (tests/test_vendor_sync.py), kept as its
      # own step so a drift is named in the job summary.
      - name: Verify the web demo vendored engine is in sync
        run: python scripts/check_vendor_sync.py

  action-selftest:
    name: Dogfood the Action (composite, end-to-end)
    strategy:
      fail-fast: false
      matrix:
        # macOS runs bash 3.2 for `shell: bash` — it caught the empty-array
        # `set -u` expansion bug ubuntu (bash 5) never would.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Use the action from this very checkout (local `./`). A clean sample +
      # the segmentation policy runs end to end through the zero-install
      # PYTHONPATH wiring on a real runner. Fail-closed stopgap (0.4.1): a
      # clean run is UNKNOWN, exit 3, and fails the step (never a PASS).
      - name: RuleHawk gate (expect UNKNOWN on a clean sample)
        id: clean
        continue-on-error: true
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          fail-on: high
          upload-sarif: false      # no code-scanning dependency in the self-test
          comment: false
      # No-policy run exercises the empty POLICY_ARGS path (the bash-3.2 trap).
      - name: RuleHawk gate (expect UNKNOWN, no policy input)
        id: nopolicy
        continue-on-error: true
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          fail-on: high
          upload-sarif: false
          comment: false
      # Evidence run exercises the EVIDENCE_ARGS path and both evidence outputs
      # — the newest wiring, and the one a compliance consumer relies on.
      - name: RuleHawk gate (expect UNKNOWN, evidence artifact on)
        id: evidence
        continue-on-error: true
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          fail-on: high
          evidence: true
          upload-sarif: false
          comment: false
      - name: Assert the UNKNOWN outputs and the evidence artifact
        env:
          OUTCOME: ${{ steps.clean.outcome }}
          VERDICT: ${{ steps.clean.outputs.verdict }}
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          NOPOLICY_OUTCOME: ${{ steps.nopolicy.outcome }}
          NOPOLICY_EXIT_CODE: ${{ steps.nopolicy.outputs.exit-code }}
          EVIDENCE_EXIT_CODE: ${{ steps.evidence.outputs.exit-code }}
          PASSED: ${{ steps.clean.outputs.passed }}
          WORST: ${{ steps.clean.outputs.worst-severity }}
          SCORE: ${{ steps.clean.outputs.score }}
          SARIF: ${{ steps.clean.outputs.sarif-file }}
          NOPOLICY_PASSED: ${{ steps.nopolicy.outputs.passed }}
          NOPOLICY_EVIDENCE: ${{ steps.nopolicy.outputs.evidence-file }}
          EVIDENCE: ${{ steps.evidence.outputs.evidence-file }}
          EVIDENCE_MD: ${{ steps.evidence.outputs.evidence-md-file }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ]      || { echo "::error::exit 3 should fail the step, got '${OUTCOME}'"; exit 1; }
          [ "${VERDICT}" = "UNKNOWN" ]      || { echo "::error::outputs.verdict should be UNKNOWN, got '${VERDICT}'"; exit 1; }
          [ "${EXIT_CODE}" = "3" ]          || { echo "::error::outputs.exit-code should be 3, got '${EXIT_CODE}'"; exit 1; }
          [ "${PASSED}" = "false" ]         || { echo "::error::outputs.passed should be false, got '${PASSED}'"; exit 1; }
          [ "${WORST}" = "none" ]           || { echo "::error::outputs.worst-severity should be none, got '${WORST}'"; exit 1; }
          [[ "${SCORE}" =~ ^[0-9]+$ ]]      || { echo "::error::outputs.score should be numeric, got '${SCORE}'"; exit 1; }
          [ -s "${SARIF}" ]                 || { echo "::error::outputs.sarif-file should name a non-empty file, got '${SARIF}'"; exit 1; }
          [ "${NOPOLICY_PASSED}" = "false" ] || { echo "::error::no-policy run should not pass, got '${NOPOLICY_PASSED}'"; exit 1; }
          [ "${NOPOLICY_OUTCOME}" = "failure" ] || { echo "::error::no-policy exit 3 should fail the step, got '${NOPOLICY_OUTCOME}'"; exit 1; }
          [ "${NOPOLICY_EXIT_CODE}" = "3" ] || { echo "::error::no-policy exit-code should be 3, got '${NOPOLICY_EXIT_CODE}'"; exit 1; }
          [ "${EVIDENCE_EXIT_CODE}" = "3" ] || { echo "::error::evidence run exit-code should be 3, got '${EVIDENCE_EXIT_CODE}'"; exit 1; }
          [ -z "${NOPOLICY_EVIDENCE}" ]     || { echo "::error::evidence-file must be empty when evidence is off, got '${NOPOLICY_EVIDENCE}'"; exit 1; }
          [ -s "${EVIDENCE}" ]              || { echo "::error::evidence-file should name a non-empty file, got '${EVIDENCE}'"; exit 1; }
          [ -s "${EVIDENCE_MD}" ]           || { echo "::error::evidence-md-file should name a non-empty file, got '${EVIDENCE_MD}'"; exit 1; }
          python3 - "${EVIDENCE}" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["schema"] == "rulehawk.evidence/v1", d["schema"]
          assert d["tool"]["generator"] == "ci", d["tool"]
          assert d["coverage"]["complete"] is True, d["coverage"]
          assert d["result"]["attestations_failed"] == 0, d["result"]
          # fail-closed stopgap: nothing is VERIFIED; each claim is INDETERMINATE
          assert d["result"]["attestations_verified"] == 0, d["result"]
          assert d["result"]["attestations_indeterminate"] >= 1, d["result"]
          assert all(a["reasons"][0]["code"] == "fail-closed-stopgap"
                     for a in d["attestations"]), d["attestations"]
          print("evidence artifact OK:", d["result"])
          PY
          echo "UNKNOWN path verified: verdict=${VERDICT}, exit-code=${EXIT_CODE}, passed=${PASSED}, worst=${WORST}, score=${SCORE}"

  action-selftest-fail-path:
    name: Dogfood the Action (FAIL verdict is enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The rc-file -> Enforce re-raise plumbing must actually turn the check
      # red: run the gate on a sample with known critical findings and assert
      # the step FAILS and the outputs carry the verdict.
      - name: RuleHawk gate (expect FAIL on a dirty sample)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          fail-on: high
          upload-sarif: false
          comment: false
      - name: Assert the gate went red with the right outputs
        env:
          OUTCOME: ${{ steps.dirty.outcome }}
          PASSED: ${{ steps.dirty.outputs.passed }}
          WORST: ${{ steps.dirty.outputs.worst-severity }}
          VERDICT: ${{ steps.dirty.outputs.verdict }}
          EXIT_CODE: ${{ steps.dirty.outputs.exit-code }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::gate did not fail on a dirty sample"; exit 1; }
          [ "${VERDICT}" = "FAIL" ]    || { echo "::error::outputs.verdict should be FAIL, got '${VERDICT}'"; exit 1; }
          [ "${EXIT_CODE}" = "1" ]     || { echo "::error::outputs.exit-code should be 1, got '${EXIT_CODE}'"; exit 1; }
          [ "${PASSED}" = "false" ]    || { echo "::error::outputs.passed should be false, got '${PASSED}'"; exit 1; }
          [ "${WORST}" = "critical" ]  || { echo "::error::outputs.worst-severity should be critical, got '${WORST}'"; exit 1; }
          echo "FAIL path verified: outcome=${OUTCOME}, passed=${PASSED}, worst=${WORST}"

  action-selftest-advisory-unknown:
    name: Dogfood the Action (fail-on none never reads as PASS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # fail-on none never blocks, but under the fail-closed stopgap it
      # reports UNKNOWN: passed=false, verdict=UNKNOWN, and the step still
      # succeeds (exit 0).
      - name: RuleHawk gate (expect UNKNOWN, not enforced)
        id: adv
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          fail-on: none
          upload-sarif: false
          comment: false
      - name: Assert the step passed but the verdict is UNKNOWN
        env:
          OUTCOME: ${{ steps.adv.outcome }}
          PASSED: ${{ steps.adv.outputs.passed }}
          VERDICT: ${{ steps.adv.outputs.verdict }}
          EXIT_CODE: ${{ steps.adv.outputs.exit-code }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "success" ] || { echo "::error::fail-on none must not fail the step"; exit 1; }
          [ "${PASSED}" = "false" ]    || { echo "::error::outputs.passed should be false, got '${PASSED}'"; exit 1; }
          [ "${VERDICT}" = "UNKNOWN" ] || { echo "::error::outputs.verdict should be UNKNOWN, got '${VERDICT}'"; exit 1; }
          [ "${EXIT_CODE}" = "0" ]     || { echo "::error::outputs.exit-code should be 0, got '${EXIT_CODE}'"; exit 1; }
          echo "advisory UNKNOWN verified: outcome=${OUTCOME}, verdict=${VERDICT}, passed=${PASSED}"

  # One PR comment for several checks: the headline is the WORST verdict, so a
  # passing check can never hide a failing one. Same-job: every gate step's
  # result stays in the job's results dir for the comment to combine.
  combined-same-job:
    name: Dogfood one verdict for several checks (one job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dirty check (expect FAIL)
        continue-on-error: true
        uses: ./
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          label: dirty
          upload-sarif: false
          comment: false
      - name: Clean check (expect UNKNOWN, fail-closed stopgap)
        continue-on-error: true
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          label: clean
          upload-sarif: false
          comment: false
      - name: The job's combined verdict is FAIL
        run: |
          set -u
          set +e
          python3 -m rulehawk combine "${RUNNER_TEMP}/rulehawk-results" --comment combined.md -q
          RC=$?
          set -e
          [ "${RC}" = "1" ] || { echo "::error::expected FAIL (exit 1), got ${RC}"; exit 1; }
          grep -q '^## ❌ RuleHawk firewall gate: FAIL' combined.md
          grep -q '| clean | ❌ UNKNOWN |' combined.md
          grep -q '| dirty | ❌ FAIL' combined.md
          if grep -q '✅' combined.md; then echo "::error::a check read PASS"; exit 1; fi
          echo "same-job combine verified"

  # Across jobs: each gate shares its result as an artifact and one job
  # combines them with ./comment.
  share-dirty:
    name: Dogfood shared result (dirty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        # The FAIL is the point; keep the job green. (Outside this self-test,
        # continue-on-error on a sharing gate step would also hide a failed
        # upload; see docs/github-action.md.)
        continue-on-error: true
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          label: dirty
          upload-sarif: false
          comment: false
          share-results: true
  share-clean:
    name: Dogfood shared result (clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        # Fail-closed stopgap: the clean check is UNKNOWN (exit 3) and fails
        # the step; keep the job green so the combine below reads its result.
        continue-on-error: true
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          label: clean
          upload-sarif: false
          comment: false
          share-results: true
  combined-across-jobs:
    name: Dogfood the combining action (./comment)
    needs: [share-dirty, share-clean]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Combine both jobs (expect FAIL)
        id: both
        continue-on-error: true
        uses: ./comment
        with:
          expect: 2
          jobs: ${{ toJSON(needs) }}
          comment: false
      # FAIL outranks UNKNOWN: a missing check beside a failing one is FAIL,
      # and the comment still names the shortfall.
      - name: A failure and a job too few (expect FAIL)
        id: worst
        continue-on-error: true
        uses: ./comment
        with:
          expect: 3
          jobs: ${{ toJSON(needs) }}
          comment: false
      - name: Fetch only the clean job's result
        uses: actions/download-artifact@v4
        with:
          pattern: rulehawk-results-*-share-clean-*
          path: ${{ runner.temp }}/rulehawk-clean-only
          merge-multiple: true
      - name: A job too few, nothing failing (expect UNKNOWN)
        id: missing
        continue-on-error: true
        uses: ./comment
        with:
          expect: 2
          jobs: ${{ toJSON(needs) }}
          results: ${{ runner.temp }}/rulehawk-clean-only
          comment: false
      - name: Assert the combined verdicts
        env:
          BOTH: ${{ steps.both.outputs.verdict }}
          BOTH_OUTCOME: ${{ steps.both.outcome }}
          BOTH_FILE: ${{ steps.both.outputs.comment-file }}
          WORST: ${{ steps.worst.outputs.verdict }}
          WORST_FILE: ${{ steps.worst.outputs.comment-file }}
          MISSING: ${{ steps.missing.outputs.verdict }}
          MISSING_FILE: ${{ steps.missing.outputs.comment-file }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          [ "${BOTH}" = "FAIL" ]              || { echo "::error::expected FAIL, got '${BOTH}'"; exit 1; }
          [ "${BOTH_OUTCOME}" = "failure" ]   || { echo "::error::the FAIL did not fail the step"; exit 1; }
          [ "${WORST}" = "FAIL" ]             || { echo "::error::expected FAIL to outrank UNKNOWN, got '${WORST}'"; exit 1; }
          grep -q 'expected 3 check(s), found 2' "${WORST_FILE}"
          [ "${MISSING}" = "UNKNOWN" ]        || { echo "::error::expected UNKNOWN, got '${MISSING}'"; exit 1; }
          if grep -q '^## ✅' "${MISSING_FILE}"; then echo "::error::a shortfall read PASS"; exit 1; fi
          [ "${MISSING_OUTCOME}" = "failure" ] || { echo "::error::the UNKNOWN did not fail the step"; exit 1; }
          grep -q '| clean | ❌ UNKNOWN |' "${BOTH_FILE}"
          grep -q '| dirty | ❌ FAIL' "${BOTH_FILE}"
          echo "across-jobs combine verified: ${BOTH}, ${WORST}, ${MISSING}"
