name: RuleHawk CI

# The engine's own gate: run the analysis-engine test suite on every change, and
# dogfood the composite Action end-to-end on real samples so the gate wiring
# itself — outputs, verdict plumbing, the evidence artifact, bash-3.2 safety —
# is exercised in real CI on both Linux and macOS runners.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per ref: a superseded PR push cancels the stale run; pushes to
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Engine test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # PyYAML is a TEST dependency only (the engine has none): it is what lets
      # tests/test_action.py load action.yml. Without it that module
      # importorskips and the Action wiring — outputs, accepted flags, the
      # bash-3.2 empty-array guards — is never checked in CI.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml
      - name: Verify the Action wiring tests will run (PyYAML importable)
        run: python -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: Run tests
        run: python -m pytest -q -rs
      # The same check the suite runs (tests/test_vendor_sync.py), kept as its
      # own step so a drift is named in the job summary.
      - name: Verify the web demo vendored engine is in sync
        run: python scripts/check_vendor_sync.py

  action-selftest:
    name: Dogfood the Action (composite, end-to-end)
    strategy:
      fail-fast: false
      matrix:
        # macOS runs bash 3.2 for `shell: bash` — it caught the empty-array
        # `set -u` expansion bug ubuntu (bash 5) never would.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Use the action from this very checkout (local `./`). A clean sample +
      # the segmentation policy must pass the gate with exit 0 — proving the
      # zero-install PYTHONPATH wiring works on a real runner.
      - name: RuleHawk gate (expect PASS on a clean sample)
        id: clean
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          fail-on: high
          upload-sarif: false      # no code-scanning dependency in the self-test
          comment: false
      # No-policy run exercises the empty POLICY_ARGS path (the bash-3.2 trap).
      - name: RuleHawk gate (expect PASS, no policy input)
        id: nopolicy
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          fail-on: high
          upload-sarif: false
          comment: false
      # Evidence run exercises the EVIDENCE_ARGS path and both evidence outputs
      # — the newest wiring, and the one a compliance consumer relies on.
      - name: RuleHawk gate (expect PASS, evidence artifact on)
        id: evidence
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          fail-on: high
          evidence: true
          upload-sarif: false
          comment: false
      - name: Assert the PASS outputs and the evidence artifact
        env:
          PASSED: ${{ steps.clean.outputs.passed }}
          WORST: ${{ steps.clean.outputs.worst-severity }}
          SCORE: ${{ steps.clean.outputs.score }}
          SARIF: ${{ steps.clean.outputs.sarif-file }}
          NOPOLICY_PASSED: ${{ steps.nopolicy.outputs.passed }}
          NOPOLICY_EVIDENCE: ${{ steps.nopolicy.outputs.evidence-file }}
          EVIDENCE: ${{ steps.evidence.outputs.evidence-file }}
          EVIDENCE_MD: ${{ steps.evidence.outputs.evidence-md-file }}
        run: |
          set -euo pipefail
          [ "${PASSED}" = "true" ]          || { echo "::error::outputs.passed should be true, got '${PASSED}'"; exit 1; }
          [ "${WORST}" = "none" ]           || { echo "::error::outputs.worst-severity should be none, got '${WORST}'"; exit 1; }
          [[ "${SCORE}" =~ ^[0-9]+$ ]]      || { echo "::error::outputs.score should be numeric, got '${SCORE}'"; exit 1; }
          [ -s "${SARIF}" ]                 || { echo "::error::outputs.sarif-file should name a non-empty file, got '${SARIF}'"; exit 1; }
          [ "${NOPOLICY_PASSED}" = "true" ] || { echo "::error::no-policy run should pass, got '${NOPOLICY_PASSED}'"; exit 1; }
          [ -z "${NOPOLICY_EVIDENCE}" ]     || { echo "::error::evidence-file must be empty when evidence is off, got '${NOPOLICY_EVIDENCE}'"; exit 1; }
          [ -s "${EVIDENCE}" ]              || { echo "::error::evidence-file should name a non-empty file, got '${EVIDENCE}'"; exit 1; }
          [ -s "${EVIDENCE_MD}" ]           || { echo "::error::evidence-md-file should name a non-empty file, got '${EVIDENCE_MD}'"; exit 1; }
          python3 - "${EVIDENCE}" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["schema"] == "rulehawk.evidence/v1", d["schema"]
          assert d["tool"]["generator"] == "ci", d["tool"]
          assert d["coverage"]["complete"] is True, d["coverage"]
          assert d["result"]["attestations_failed"] == 0, d["result"]
          assert d["result"]["attestations_verified"] >= 1, d["result"]
          print("evidence artifact OK:", d["result"])
          PY
          echo "PASS path verified: passed=${PASSED}, worst=${WORST}, score=${SCORE}"

  action-selftest-fail-path:
    name: Dogfood the Action (FAIL verdict is enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The rc-file -> Enforce re-raise plumbing must actually turn the check
      # red: run the gate on a sample with known critical findings and assert
      # the step FAILS and the outputs carry the verdict.
      - name: RuleHawk gate (expect FAIL on a dirty sample)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          fail-on: high
          upload-sarif: false
          comment: false
      - name: Assert the gate went red with the right outputs
        env:
          OUTCOME: ${{ steps.dirty.outcome }}
          PASSED: ${{ steps.dirty.outputs.passed }}
          WORST: ${{ steps.dirty.outputs.worst-severity }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::gate did not fail on a dirty sample"; exit 1; }
          [ "${PASSED}" = "false" ]    || { echo "::error::outputs.passed should be false, got '${PASSED}'"; exit 1; }
          [ "${WORST}" = "critical" ]  || { echo "::error::outputs.worst-severity should be critical, got '${WORST}'"; exit 1; }
          echo "FAIL path verified: outcome=${OUTCOME}, passed=${PASSED}, worst=${WORST}"

  # One PR comment for several checks: the headline is the WORST verdict, so a
  # passing check can never hide a failing one. Same-job: every gate step's
  # result stays in the job's results dir for the comment to combine.
  combined-same-job:
    name: Dogfood one verdict for several checks (one job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dirty check (expect FAIL)
        continue-on-error: true
        uses: ./
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          label: dirty
          upload-sarif: false
          comment: false
      - name: Clean check (expect PASS)
        uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          label: clean
          upload-sarif: false
          comment: false
      - name: The job's combined verdict is FAIL
        run: |
          set -u
          set +e
          python3 -m rulehawk combine "${RUNNER_TEMP}/rulehawk-results" --comment combined.md -q
          RC=$?
          set -e
          [ "${RC}" = "1" ] || { echo "::error::expected FAIL (exit 1), got ${RC}"; exit 1; }
          grep -q '^## ❌ RuleHawk firewall gate: FAIL' combined.md
          grep -q '| clean | ✅ PASS |' combined.md
          grep -q '| dirty | ❌ FAIL' combined.md
          echo "same-job combine verified"

  # Across jobs: each gate shares its result as an artifact and one job
  # combines them with ./comment.
  share-dirty:
    name: Dogfood shared result (dirty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        continue-on-error: true      # the FAIL is the point; keep the job green
        with:
          configs: samples/ios_acl.txt
          policy: samples/policy.json
          label: dirty
          upload-sarif: false
          comment: false
          share-results: true
  share-clean:
    name: Dogfood shared result (clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          configs: samples/adv_realistic.txt
          policy: samples/policy.json
          label: clean
          upload-sarif: false
          comment: false
          share-results: true
  combined-across-jobs:
    name: Dogfood the combining action (./comment)
    needs: [share-dirty, share-clean]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Combine both jobs (expect FAIL)
        id: both
        continue-on-error: true
        uses: ./comment
        with:
          expect: 2
          jobs: ${{ toJSON(needs) }}
          comment: false
      - name: A job too few (expect UNKNOWN)
        id: missing
        continue-on-error: true
        uses: ./comment
        with:
          expect: 3
          jobs: ${{ toJSON(needs) }}
          comment: false
      - name: Assert the combined verdicts
        env:
          BOTH: ${{ steps.both.outputs.verdict }}
          BOTH_OUTCOME: ${{ steps.both.outcome }}
          BOTH_FILE: ${{ steps.both.outputs.comment-file }}
          MISSING: ${{ steps.missing.outputs.verdict }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          [ "${BOTH}" = "FAIL" ]              || { echo "::error::expected FAIL, got '${BOTH}'"; exit 1; }
          [ "${BOTH_OUTCOME}" = "failure" ]   || { echo "::error::the FAIL did not fail the step"; exit 1; }
          [ "${MISSING}" = "UNKNOWN" ]        || { echo "::error::expected UNKNOWN, got '${MISSING}'"; exit 1; }
          [ "${MISSING_OUTCOME}" = "failure" ] || { echo "::error::the UNKNOWN did not fail the step"; exit 1; }
          grep -q '| clean | ✅ PASS |' "${BOTH_FILE}"
          grep -q '| dirty | ❌ FAIL' "${BOTH_FILE}"
          echo "across-jobs combine verified: ${BOTH}, ${MISSING}"
